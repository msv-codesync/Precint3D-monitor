[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#16856B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1D23"
linkColor = "#16856B"
borderColor = "#E5E7EB"
codeBackgroundColor = "#F3F4F6"
codeTextColor = "#1A1D23"
dataframeHeaderBackgroundColor = "#F3F4F6"
dataframeBorderColor = "#E5E7EB"
redColor = "#B4372A"
orangeColor = "#C77E00"
greenColor = "#16856B"
blueColor = "#2A6FB3"
grayColor = "#6B7280"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "Syne:https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap"
baseFontSize = 15
headingFontSizes = ["1.85rem", "1.35rem", "1.15rem", "1.05rem", "1rem", "0.95rem"]
headingFontWeights = [800, 700, 700, 700, 600, 600]
baseRadius = "0.55rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false

[theme.sidebar]
backgroundColor = "#0F1620"
secondaryBackgroundColor = "#182233"
textColor = "#E9E2D3"
borderColor = "#1E2A3E"
primaryColor = "#16856B"
